<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log ind – SG Seest Gulvteknik Portal</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/tokens.css" />
</head>

<body>
  <div class="login-container">
    <div class="login-box">
      <div class="logo" style="text-align:center;margin-bottom:16px;">
        <img src="seestlogo.png" alt="Logo" style="max-height:80px;opacity:.9" />
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-mail:</label>
          <input type="email" id="email" name="email" placeholder="mail@firma.dk" required />
        </div>

        <div class="form-group">
          <label for="password">Adgangskode:</label>
          <input type="password" id="password" name="password" placeholder="********" required />
        </div>

        <button type="submit" class="login-btn">Log ind</button>
      </form>

      <div id="message" class="message"></div>

      <div style="margin-top:16px;text-align:center;font-size:14px;">
        <a href="#" onclick="toggleRegister(); return false;" id="registerLink" style="color: #1A1A1A; text-decoration: underline; text-underline-offset: 3px; font-weight: 500;">Ny bruger? Registrer her</a>
      </div>
    </div>
  </div>

  <!-- Registrerings formular (skjult som standard) -->
  <div class="login-container" id="registerContainer" style="display: none;">
    <div class="login-box">
      <div class="logo" style="text-align:center;margin-bottom:16px;">
        <img src="seestlogo.png" alt="Logo" style="max-height:80px;opacity:.9" />
      </div>

      <h2 style="text-align: center; margin-bottom: 20px;">Opret Bruger</h2>

      <form id="registerForm">
        <div class="form-group">
          <label for="regFirstName">Fornavn:</label>
          <input type="text" id="regFirstName" placeholder="Fornavn" required minlength="2" />
        </div>

        <div class="form-group">
          <label for="regLastName">Efternavn:</label>
          <input type="text" id="regLastName" placeholder="Efternavn" required minlength="2" />
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail:</label>
          <input type="email" id="regEmail" placeholder="mail@firma.dk" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Adgangskode:</label>
          <input type="password" id="regPassword" placeholder="Mindst 6 tegn" required minlength="6" />
          <small style="display: block; margin-top: 5px; color: #666;">Stilling og afdeling sættes af en administrator.</small>
        </div>

        <div class="form-group">
          <label for="regInviteCode">Invite kode (valgfri):</label>
          <input type="text" id="regInviteCode" placeholder="Hvis du har en invite kode" />
          <small style="display: block; margin-top: 5px; color: #666;">Med invite kode får du direkte adgang. Uden kode skal en admin godkende dig.</small>
        </div>

        <button type="submit" class="login-btn">Opret bruger</button>
      </form>

      <div id="regMessage" class="message"></div>

      <div style="margin-top:16px;text-align:center;font-size:14px;">
        <a href="#" onclick="toggleRegister(); return false;" style="color: #1A1A1A; text-decoration: underline; text-underline-offset: 3px; font-weight: 500;">← Tilbage til login</a>
      </div>
    </div>
  </div>

  <script>
    function toggleRegister() {
      const loginContainer = document.querySelector('.login-container:not(#registerContainer)');
      const registerContainer = document.getElementById('registerContainer');
      
      if (loginContainer.style.display === 'none') {
        loginContainer.style.display = 'flex';
        registerContainer.style.display = 'none';
      } else {
        loginContainer.style.display = 'none';
        registerContainer.style.display = 'flex';
      }
    }

    // Håndter registrering
    document.getElementById('registerForm')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const msgEl = document.getElementById('regMessage');
      msgEl.textContent = 'Opretter bruger...';
      msgEl.className = 'message';
      msgEl.style.display = 'block';
      
      const data = {
        firstName: document.getElementById('regFirstName').value.trim(),
        lastName: document.getElementById('regLastName').value.trim(),
        email: document.getElementById('regEmail').value.trim(),
        password: document.getElementById('regPassword').value,
        inviteCode: document.getElementById('regInviteCode').value.trim()
      };
      
      // Frontend-validering (backend validerer ogsaa)
      const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[A-Za-z]{2,}$/;
      if (data.firstName.length < 2) { msgEl.textContent = 'Fornavn skal være mindst 2 tegn.'; msgEl.className = 'message error'; return; }
      if (data.lastName.length < 2) { msgEl.textContent = 'Efternavn skal være mindst 2 tegn.'; msgEl.className = 'message error'; return; }
      if (!EMAIL_RE.test(data.email)) { msgEl.textContent = 'Indtast en gyldig e-mailadresse (fx mail@firma.dk).'; msgEl.className = 'message error'; return; }
      if (data.password.length < 6) { msgEl.textContent = 'Adgangskoden skal være mindst 6 tegn.'; msgEl.className = 'message error'; return; }
      data.name = data.firstName + ' ' + data.lastName;
      
      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (!response.ok) {
          throw new Error(result.error || 'Registrering fejlede');
        }
        
        if (result.pending) {
          msgEl.textContent = '✅ ' + result.message + '\n\nDu får besked når din bruger er godkendt.';
          msgEl.className = 'message success';
          setTimeout(() => toggleRegister(), 3000);
        } else {
          msgEl.textContent = '✅ Bruger oprettet! Logger ind...';
          msgEl.className = 'message success';
          
          // Auto-login
          sessionStorage.setItem('token', result.token);
          sessionStorage.setItem('currentUser', JSON.stringify(result.user));
          
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1500);
        }
      } catch (err) {
        msgEl.textContent = '❌ ' + err.message;
        msgEl.className = 'message error';
      }
    });
  </script>

  <!-- VIGTIGT: module-script så import virker -->
  <script type="module" src="js/login.js"></script>
</body>
</html>

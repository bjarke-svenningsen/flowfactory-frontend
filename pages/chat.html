<div class="chat-page-header">
    <div>
        <h2>Chat &amp; Video</h2>
        <div class="chat-page-subtitle" id="chatPageSubtitle">&nbsp;</div>
    </div>
</div>
<div class="chat-container">
    <div class="chat-users" id="chatListPane">
        <div class="user-search">
            <i data-lucide="search" class="user-search-icon"></i>
            <input type="text" placeholder="Søg..." id="userSearch" oninput="filterUsers()">
        </div>
        <div class="chat-contacts-strip" id="chatContactsStrip"></div>
        <div class="chat-filter-chips">
            <button class="chat-chip active" id="chatChipAlle" onclick="setChatFilter('alle')">Alle</button>
            <button class="chat-chip" id="chatChipUlaeste" onclick="setChatFilter('ulaeste')">Ul&aelig;ste</button>
            <button class="chat-chip" id="chatChipOnline" onclick="setChatFilter('online')">Online</button>
        </div>
        <div id="userList"></div>
    </div>

    <div class="chat-main">
        <div class="no-chat-selected" id="noChatSelected">
            <div style="text-align: center; color: var(--text-muted, #8a8f98);">
                <i data-lucide="message-square" class="no-chat-icon"></i>
                <h3>V&aelig;lg en medarbejder</h3>
                <p>V&aelig;lg en person fra listen for at starte en chat</p>
            </div>
        </div>

        <div class="chat-active" id="chatActive" style="display: none;">
            <div class="chat-header">
                <button class="chat-back-btn" id="chatBackBtn" onclick="closeChat()" title="Tilbage">
                    <i data-lucide="arrow-left"></i>
                </button>
                <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;">
                    <div class="user-avatar-small" id="chatUserAvatar">?</div>
                    <div style="min-width: 0;">
                        <div class="chat-user-name" id="chatUserName">&nbsp;</div>
                        <div class="chat-user-status" id="chatUserStatus">&nbsp;</div>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; position: relative;">
                    <button class="chat-video-btn" id="chatVideoBtn" onclick="startVideoCallCurrent()" title="Start videoopkald">
                        <i data-lucide="video"></i><span class="chat-video-btn-label">Videoopkald</span>
                    </button>
                    <button class="chat-menu-btn" onclick="toggleChatMenu(event)" title="Mere">
                        <i data-lucide="more-vertical"></i>
                    </button>
                    <div class="chat-menu" id="chatMenu" style="display: none;">
                        <button onclick="toggleChatSound()"><i data-lucide="volume-2"></i><span id="chatSoundMenuLabel">Lyd: til</span></button>
                        <button onclick="enableChatNotifications()"><i data-lucide="bell"></i>Sl&aring; browsernotifikation til</button>
                        <button onclick="closeChat()"><i data-lucide="x"></i>Luk samtale</button>
                    </div>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-typing-bubble" id="chatTypingBubble" style="display: none;">
                <span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>
            </div>

            <div class="chat-input-area">
                <textarea id="chatInput" placeholder="Skriv en besked..." rows="1" oninput="autoGrowTextarea(); handleTyping();" onkeydown="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>
                <button class="send-btn" onclick="sendMessage()" title="Send"><i data-lucide="send"></i></button>
            </div>
        </div>
    </div>
</div>

<!-- v113: Portal-kalender - ugevisning med hel-dags bjaelker (ingen tidspunkter) -->
<style>
  .cal-wrap { display: flex; gap: 12px; height: 100%; min-height: 780px; }
  .cal-side { width: 230px; flex: 0 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px; overflow-y: auto; }
  .cal-side h3 { margin: 0 0 6px; font-size: 13px; color: var(--text); }
  .cal-side .cal-side-sub { font-size: 11px; color: var(--text-muted); margin-bottom: 8px; }
  .avail-toggle { display: flex; gap: 6px; margin-bottom: 10px; }
  .avail-toggle button { flex: 1; font-size: 11px; padding: 4px 0; border: 1px solid var(--border); background: transparent; border-radius: 6px; cursor: pointer; color: var(--text); }
  .avail-toggle button.active { background: var(--accent); border-color: var(--accent); font-weight: 600; }
  .avail-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .avail-chip { font-size: 12px; padding: 4px 10px; border-radius: 14px; background: #e8f0fe; color: #1a3d7c; font-weight: 500; }
  .avail-none { font-size: 12px; color: var(--text-muted); }
  .cal-main { flex: 1; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .cal-toolbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
  .cal-toolbar h2 { margin: 0; font-size: 16px; flex: 1; }
  .cal-toolbar button { border: 1px solid var(--border); background: transparent; border-radius: 8px; padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 13px; }
  .cal-toolbar button:hover { background: var(--border-soft); }
  .cal-grid-header { display: grid; grid-template-columns: repeat(7, 1fr); border-bottom: 1px solid var(--border); }
  .cal-day-head { padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); }
  .cal-day-head.today { color: #1a73e8; }
  .cal-day-head .cal-day-num { display: block; font-size: 18px; color: var(--text); }
  .cal-day-head.today .cal-day-num { background: #1a73e8; color: #fff; border-radius: 50%; width: 30px; margin: 2px auto 0; padding: 3px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); flex: 1; position: relative; }
  .cal-day-col { border-right: 1px solid var(--border-soft); min-height: 190px; cursor: pointer; position: relative; overflow: hidden;
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, var(--border-soft) 27px, var(--border-soft) 28px); }
  .cal-day-col:last-child { border-right: none; }
  .cal-day-col.today { background-color: rgba(26,115,232,0.04); }
  .cal-event-wrap { position: absolute; left: 2px; right: 2px; z-index: 2; }
  .cal-event { display: block; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; color: #fff; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; border: none; text-align: left; width: 100%; }
  .cal-emp { margin-top: 2px; background: #c5221f; color: #fff; border-radius: 4px; padding: 0 7px; font-size: 9.5px; line-height: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .cal-empty-hint { font-size: 11px; color: var(--text-muted); padding: 6px; }
  .cal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 500; }
  .cal-overlay.open { display: flex; }
  .cal-dialog { background: var(--surface); border-radius: 12px; padding: 20px; width: 420px; max-width: 92vw; max-height: 86vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
  .cal-dialog h3 { margin: 0 0 14px; font-size: 16px; }
  .cal-dialog label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; color: var(--text); }
  .cal-dialog input[type="text"], .cal-dialog input[type="date"] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; box-sizing: border-box; }
  .cal-colors { display: flex; gap: 8px; flex-wrap: wrap; }
  .cal-color-dot { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .cal-color-dot.selected { border-color: var(--text); transform: scale(1.12); }
  .cal-dialog-buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
  .cal-dialog-buttons button { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; color: var(--text); font-size: 13px; }
  .cal-dialog-buttons button.primary { background: var(--accent); border-color: var(--accent); font-weight: 600; color: #2D3139; }
  .cal-dialog-buttons button.danger { color: #c5221f; border-color: #c5221f; margin-right: auto; }
  .cal-meta { font-size: 11.5px; color: var(--text-muted); line-height: 1.7; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
</style>
<!-- __CAL_MARKUP__ -->

<div class="cal-wrap">
  <div class="cal-side">
    <h3>Ikke bemandet</h3>
    <div class="cal-side-sub" id="avail-sub"></div>
    <div class="avail-toggle" id="avail-toggle" style="display:none;">
      <button id="avail-btn-day" class="active" onclick="calendarPage.setAvailMode('day')">Dag</button>
      <button id="avail-btn-week" onclick="calendarPage.setAvailMode('week')">Uge</button>
    </div>
    <div class="avail-list" id="avail-list"></div>
  </div>

  <div class="cal-main">
    <div class="cal-toolbar">
      <button onclick="calendarPage.prevWeek()">&#9664;</button>
      <button onclick="calendarPage.goToday()">I dag</button>
      <h2 id="cal-week-label"></h2>
      <button onclick="calendarPage.nextWeek()">&#9654;</button>
      <button id="cal-new-btn" onclick="calendarPage.openNewDialog()" style="font-weight:600;">+ Ny opgave</button>
    </div>
    <div class="cal-grid-header" id="cal-grid-header"></div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>
</div>

<!-- Ny / rediger opgave -->
<div class="cal-overlay" id="cal-edit-overlay">
  <div class="cal-dialog">
    <h3 id="cal-edit-title">Ny opgave</h3>
    <input type="hidden" id="cal-edit-id" />
    <label>Ordrenummer (fx 3429)</label>
    <input type="text" id="cal-edit-order" placeholder="fx 3429" />
    <label>Kort beskrivelse *</label>
    <input type="text" id="cal-edit-desc" placeholder="fx Autocentrum - Revne" />
    <label>Fra dato *</label>
    <input type="date" id="cal-edit-start" />
    <label>Gentagelser (antal dage) *</label>
    <input type="number" id="cal-edit-repeat" min="1" max="31" value="1" />
    <label>Bemanding (rød bjælke)</label>
    <input type="text" id="cal-edit-staff" placeholder="fx Henrik, Jakob" />
    <label>Farve</label>
    <div class="cal-colors" id="cal-colors"></div>
    <div class="cal-dialog-buttons">
      <button id="cal-edit-delete" class="danger" style="display:none;" onclick="calendarPage.deleteEvent()">Slet</button>
      <button onclick="calendarPage.closeEditDialog()">Annuller</button>
      <button class="primary" onclick="calendarPage.saveEvent()">Gem</button>
    </div>
  </div>
</div>
<!-- Info om opgave -->
<div class="cal-overlay" id="cal-info-overlay">
  <div class="cal-dialog">
    <h3 id="cal-info-title"></h3>
    <div id="cal-info-body"></div>
    <div class="cal-meta" id="cal-info-meta"></div>
    <div class="cal-dialog-buttons">
      <button id="cal-info-delete" class="danger" style="display:none;" onclick="calendarPage.deleteFromInfo()">Slet</button>
      <button id="cal-info-order" style="display:none;">Åbn ordre</button>
      <button id="cal-info-edit" class="primary" style="display:none;" onclick="calendarPage.editFromInfo()">Rediger</button>
      <button onclick="calendarPage.closeOverlay('cal-info-overlay')">Luk</button>
    </div>
  </div>
</div>

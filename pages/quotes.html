<!-- Tab Navigation -->
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="margin: 0; display: flex; align-items: center; gap: 10px;"><i data-lucide="clipboard-list"></i> Ordrestyring</h2>
</div>

<div class="tab-underline" style="margin-bottom: 20px;">
    <button id="tabQuotes" onclick="switchOrderTab('quotes')" class="tab-underline-btn">Tilbud</button>
    <button id="tabOrders" onclick="switchOrderTab('orders')" class="tab-underline-btn">Godkendte Ordre</button>
    <button id="tabInvoiced" onclick="switchOrderTab('invoiced')" class="tab-underline-btn">Faktureret</button>
    <button id="tabRejected" onclick="switchOrderTab('rejected')" class="tab-underline-btn">Afvist</button>
    <button id="tabCustomers" onclick="switchOrderTab('customers')" class="tab-underline-btn">Kunder</button>
</div>

<!-- TAB 1: TILBUD -->
<div id="orderTabQuotes" class="order-tab-content" style="display: none;">
    <div id="quotesListView">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; flex-wrap: wrap;">
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button onclick="filterQuotesByStatus('all')" id="filterAll" class="filter-pill active">
                    Alle
                </button>
                <button onclick="filterQuotesByStatus('draft')" id="filterDraft" class="filter-pill">
                    Udkast
                </button>
                <button onclick="filterQuotesByStatus('sent')" id="filterSent" class="filter-pill">
                    Sendt
                </button>
                <button onclick="filterQuotesByStatus('rejected')" id="filterRejected" class="filter-pill">
                    Afvist
                </button>
            </div>
            <button onclick="showCreateQuote()" class="btn-primary">
                <i data-lucide="plus"></i> Nyt Tilbud
            </button>
        </div>
        
        <div id="quotesListContainer"></div>
    </div>
</div>

<!-- TAB 2: ORDRE -->
<div id="orderTabOrders" class="order-tab-content" style="display: none;">
    <div id="ordersContainer"></div>
</div>

<!-- TAB 3: FAKTURERET -->
<div id="orderTabInvoiced" class="order-tab-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Fakturerede ordrer og fakturaer</p>
    </div>
    
    <div id="invoicingContainer"></div>
</div>

<!-- TAB 4: AFVIST -->
<div id="orderTabRejected" class="order-tab-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <p style="color: #666;">Afviste tilbud</p>
    </div>
    
    <div id="rejectedContainer"></div>
</div>

<!-- TAB 5: KUNDER -->
<div id="orderTabCustomers" class="order-tab-content" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div></div>
        <button onclick="showCreateCustomer()" class="btn-primary">
            <i data-lucide="user-plus"></i> Opret Ny Kunde
        </button>
    </div>
    
    <div id="customersListContainer"></div>
</div>

<!-- Form View -->
<div id="quotesFormView" style="display: none;">
    <div style="margin-bottom: 20px;">
        <button onclick="backToQuotesList()" class="btn-secondary">
            <i data-lucide="arrow-left"></i> Tilbage til oversigt
        </button>
    </div>
    
    <div id="quotesFormContainer"></div>
</div>

<!-- Preview View -->
<div id="quotesPreviewView" style="display: none;">
    <div style="margin-bottom: 20px;">
        <button onclick="backToQuotesList()" class="btn-secondary">
            <i data-lucide="arrow-left"></i> Tilbage til oversigt
        </button>
    </div>
    
    <div id="quotesPreviewContainer"></div>
</div>

<!-- Customers View -->
<div id="quotesCustomersView" style="display: none;">
    <div id="customersListContainer"></div>
</div>

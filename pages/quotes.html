<!-- Sidehoved -->
<div class="page-header">
    <div class="page-header-title">
        <span class="icon-box"><i data-lucide="clipboard-list"></i></span>
        <div>
            <h1>Ordrestyring</h1>
            <p class="page-header-sub" id="quotesPageSub">Tilbud, ordrer, fakturaer og kunder</p>
        </div>
    </div>
</div>

<!-- Tab Navigation -->
<div class="tabs" style="margin-bottom: 20px;">
    <button id="tabQuotes" onclick="switchOrderTab('quotes')" class="tab">Tilbud</button>
    <button id="tabOrders" onclick="switchOrderTab('orders')" class="tab">Godkendte Ordre</button>
    <button id="tabInvoiced" onclick="switchOrderTab('invoiced')" class="tab">Faktureret</button>
    <button id="tabRejected" onclick="switchOrderTab('rejected')" class="tab">Afvist</button>
    <button id="tabCustomers" onclick="switchOrderTab('customers')" class="tab">Kunder</button>
</div>

<!-- TAB 1: TILBUD -->
<div id="orderTabQuotes" class="order-tab-content" style="display: none;">
    <div id="quotesListView">
        <div class="page-header">
            <div class="page-header-actions">
                <button onclick="filterQuotesByStatus('all')" id="filterAll" class="pill active">Alle</button>
                <button onclick="filterQuotesByStatus('draft')" id="filterDraft" class="pill">Udkast</button>
                <button onclick="filterQuotesByStatus('sent')" id="filterSent" class="pill">Sendt</button>
                <button onclick="filterQuotesByStatus('rejected')" id="filterRejected" class="pill">Afvist</button>
            </div>
            <div class="page-header-actions">
                <button onclick="showCreateQuote()" class="btn btn-primary">
                    <i data-lucide="plus"></i> Nyt Tilbud
                </button>
            </div>
        </div>

        <div id="quotesListContainer"></div>
    </div>
</div>

<!-- TAB 2: ORDRE -->
<div id="orderTabOrders" class="order-tab-content" style="display: none;">
    <div id="ordersContainer"></div>
</div>

<!-- TAB 3: FAKTURERET -->
<div id="orderTabInvoiced" class="order-tab-content" style="display: none;">
    <div id="invoicingContainer"></div>
</div>

<!-- TAB 4: AFVIST -->
<div id="orderTabRejected" class="order-tab-content" style="display: none;">
    <div id="rejectedContainer"></div>
</div>

<!-- TAB 5: KUNDER -->
<div id="orderTabCustomers" class="order-tab-content" style="display: none;">
    <div class="page-header">
        <div></div>
        <div class="page-header-actions">
            <button onclick="showCreateCustomer()" class="btn btn-primary">
                <i data-lucide="user-plus"></i> Opret Ny Kunde
            </button>
        </div>
    </div>

    <div id="customersListContainer"></div>
</div>

<!-- Form View -->
<div id="quotesFormView" style="display: none;">
    <div style="margin-bottom: 20px;">
        <button onclick="backToQuotesList()" class="btn btn-secondary">
            <i data-lucide="arrow-left"></i> Tilbage til oversigt
        </button>
    </div>

    <div id="quotesFormContainer"></div>
</div>

<!-- Preview View -->
<div id="quotesPreviewView" style="display: none;">
    <div style="margin-bottom: 20px;">
        <button onclick="backToQuotesList()" class="btn btn-secondary">
            <i data-lucide="arrow-left"></i> Tilbage til oversigt
        </button>
    </div>

    <div id="quotesPreviewContainer"></div>
</div>

<!-- Customers View -->
<div id="quotesCustomersView" style="display: none;">
    <div id="customersListContainer"></div>
</div>

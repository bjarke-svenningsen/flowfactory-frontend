<div class="file-explorer files-shell">
    <div class="files-toolbar">
        <div class="files-toolbar-left">
            <button class="btn btn-secondary btn-icon" onclick="navigateBack()" title="Tilbage" aria-label="Tilbage"><i data-lucide="arrow-left"></i></button>
            <button class="btn btn-secondary btn-icon" onclick="navigateUp()" title="Op ét niveau" aria-label="Op ét niveau"><i data-lucide="arrow-up"></i></button>
            <nav class="files-crumb" id="filesCrumb" aria-label="Placering"></nav>
        </div>
        <div class="files-toolbar-right">
            <div class="files-search">
                <i data-lucide="search"></i>
                <input type="search" id="filesSearch" placeholder="Søg filer..." oninput="onFilesSearchInput(event)">
            </div>
            <div class="files-view-toggle" role="group" aria-label="Visning">
                <button class="btn btn-secondary btn-icon active" id="viewListBtn" onclick="setFilesView('list')" title="Listevisning" aria-label="Listevisning"><i data-lucide="list"></i></button>
                <button class="btn btn-secondary btn-icon" id="viewGridBtn" onclick="setFilesView('images')" title="Billedvisning" aria-label="Billedvisning"><i data-lucide="layout-grid"></i></button>
            </div>
            <button class="btn btn-secondary" onclick="showNewFolderDialog()"><i data-lucide="folder-plus"></i>Ny mappe</button>
            <button class="btn btn-secondary btn-icon" onclick="refreshExplorer()" title="Opdater" aria-label="Opdater"><i data-lucide="refresh-cw"></i></button>
            <button class="btn btn-primary" onclick="document.getElementById('fileExplorerUpload').click()"><i data-lucide="upload"></i>Upload</button>
            <button class="btn btn-secondary" id="uploadFolderBtn" onclick="onUploadFolderClick()" title="Upload en hel mappe"><i data-lucide="folder-up"></i>Upload mappe</button>
            <input type="file" id="fileExplorerUpload" style="display: none;" onchange="uploadFileToExplorer(event)" multiple>
            <input type="file" id="fileExplorerFolderUpload" style="display: none;" onchange="uploadFolderFromExplorer(event)" webkitdirectory multiple>
        </div>
    </div>

    <div class="files-chips" id="filesChips"></div>

    <div class="files-columns">
        <aside class="files-tree" id="folderTree"></aside>

        <div class="files-main">
            <table class="files-table" id="fileTable">
                <thead>
                    <tr>
                        <th class="col-check"><input type="checkbox" id="filesSelectAll" onchange="toggleSelectAllFiles(event)" title="Vælg alle"></th>
                        <th class="col-name" onclick="sortFiles('name')">Navn</th>
                        <th class="col-size" onclick="sortFiles('size')">Størrelse</th>
                        <th class="col-type" onclick="sortFiles('type')">Type</th>
                        <th class="col-date" onclick="sortFiles('date')">Ændret</th>
                    </tr>
                </thead>
                <tbody id="fileListBody"></tbody>
            </table>
            <div class="files-grid" id="filesGridView" hidden></div>
            <div class="files-statusbar">
                <span id="fileCount">0 objekter</span>
                <span id="selectedInfo"></span>
            </div>
        </div>

        <aside class="files-details" id="filesDetails">
            <div class="files-details-empty">
                <i data-lucide="mouse-pointer-click"></i>
                <p>Vælg en fil for at se detaljer og handlinger.</p>
            </div>
        </aside>
    </div>
</div>

<div id="contextMenu" class="context-menu">
    <div class="context-menu-item" onclick="openSelectedFile()">Åbn</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" id="ctxCut" onclick="cutSelected()">Klip</div>
    <div class="context-menu-item" id="ctxCopy" onclick="copySelected()">Kopier</div>
    <div class="context-menu-item" id="ctxPasteFile" style="display:none" onclick="pasteClipboard()">Sæt ind</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" onclick="downloadFile()"> Download</div>
    <div class="context-menu-item" onclick="shareFile()"> Del med kolleger</div>
    <div class="context-menu-item" onclick="moveSelectedToFolder()">Flyt til...</div>
    <div class="context-menu-item" onclick="transferToOrder()"> Overfør til ordre</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" onclick="deleteSelected()">Slet</div>
    <div class="context-menu-item" onclick="renameSelected()">Omdøb</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" onclick="showProperties()">Egenskaber</div>
</div>

<div id="folderContextMenu" class="context-menu">
    <div class="context-menu-item" onclick="openFolder(selectedFolderId, selectedFolderName)"> Åbn</div>
    <div class="context-menu-item" onclick="createSubfolder()"> Ny undermappe</div>
<div class="context-menu-item" id="ctxFolderPaste" style="display:none" onclick="pasteClipboard()">Sæt ind</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" id="ctxFolderRename" onclick="renameFolderSelected()"> Omdøb mappe</div>
    <div class="context-menu-item" id="ctxFolderMove" onclick="moveFolderSelected()"> Flyt til...</div>
    <div class="context-menu-item" id="ctxFolderDelete" onclick="deleteFolderSelected()"> Slet mappe</div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" onclick="showFolderProperties()"> Egenskaber</div>
</div>

<!-- Sidehoved -->
<div class="page-header">
    <div class="page-header-title">
        <span class="icon-box"><i data-lucide="shield-user"></i></span>
        <div>
            <h1>Admin Panel</h1>
            <p class="page-header-sub">Brugere, godkendelser og invite koder</p>
        </div>
    </div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px;">
    <div class="stat-card" style="padding: 20px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
            <span class="icon-box"><i data-lucide="users"></i></span>
            <h3 style="margin: 0;">Statistik</h3>
        </div>
        <p style="font-size: 32px; font-weight: 700; margin: 0; color: var(--text); font-variant-numeric: tabular-nums;" id="adminTotalUsers">-</p>
        <p style="margin: 5px 0 0 0; color: var(--text-muted);">Totale brugere</p>
    </div>
    <div class="stat-card" style="padding: 20px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
            <span class="icon-box"><i data-lucide="hourglass"></i></span>
            <h3 style="margin: 0;">Afventende</h3>
        </div>
        <p style="font-size: 32px; font-weight: 700; margin: 0; color: var(--text); font-variant-numeric: tabular-nums;" id="adminPendingUsers">-</p>
        <p style="margin: 5px 0 0 0; color: var(--text-muted);">Godkendelser</p>
    </div>
    <div class="stat-card" style="padding: 20px;">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 10px;">
            <span class="icon-box"><i data-lucide="ticket"></i></span>
            <h3 style="margin: 0;">Invite Koder</h3>
        </div>
        <p style="font-size: 32px; font-weight: 700; margin: 0; color: var(--text); font-variant-numeric: tabular-nums;" id="adminInviteCodes">-</p>
        <p style="margin: 5px 0 0 0; color: var(--text-muted);">Aktive koder</p>
    </div>
</div>

<!-- Ventende Brugere -->
<div class="info-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0;">Ventende Registreringer</h3>
        <button onclick="loadPendingUsers()" class="btn btn-secondary">
            <i data-lucide="refresh-cw"></i> Opdater
        </button>
    </div>
    <div id="pendingUsersList"></div>
</div>

<!-- Invite Koder -->
<div class="info-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px;">
        <h3 style="margin: 0;">Invite Koder</h3>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button onclick="sendEmailInvitation()" class="btn btn-secondary">
                <i data-lucide="mail"></i> Send Email Invitation
            </button>
            <button onclick="generateInviteCode()" class="btn btn-primary">
                <i data-lucide="plus"></i> Generer Ny Kode
            </button>
        </div>
    </div>
    <div id="inviteCodesList"></div>
</div>

<!-- Alle Brugere -->
<div class="info-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0;">Alle Brugere</h3>
        <button onclick="loadAllUsers()" class="btn btn-secondary">
            <i data-lucide="refresh-cw"></i> Opdater
        </button>
    </div>
    <div id="allUsersList"></div>
</div>
